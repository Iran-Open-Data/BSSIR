# Raw file metadata by year
#
# Defines the original source files associated with each data release year.
# Each year contains a list of downloadable files with their original filenames
# and source URLs. This metadata is used to locate, download, and track raw
# input files before processing and transformation.
#
# Structure:
#   <year>:
#     files:
#       - name: Original filename of the raw file
#         original: Source URL where the file was obtained
